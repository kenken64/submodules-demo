name: Build and push image

# Builds the bundled Snip app (the `bundle/` submodule) into a Docker image and
# pushes it to GitHub Container Registry (ghcr.io). Runs from `main`, where the
# bundle pointer lives — the checkout pulls the pinned bundle commit via submodules,
# so the image always matches the released bundle.
#
# Image:  ghcr.io/<owner>/<repo>:latest  (+ a :sha-<short> tag per build)
# Auth:   the built-in GITHUB_TOKEN (no extra secrets needed).
on:
  push:
    branches: [main]
    paths:
      - bundle                       # the submodule pointer (gitlink) was bumped
      - .github/workflows/docker.yml
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # populate bundle/ at its pinned commit
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./bundle
          file: ./bundle/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
