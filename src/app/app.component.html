<main>
  <h1>Snip</h1>
  <p class="sub">Paste a URL, get a short link — the same API the CLI uses.</p>

  <form (ngSubmit)="shorten()">
    <input
      type="url"
      name="url"
      placeholder="https://example.com/very/long/link"
      [(ngModel)]="url"
      required
    />
    <button type="submit">Shorten</button>
  </form>

  @if (lastShort(); as short) {
    <p class="result">
      Short link:
      <a [href]="short" target="_blank" rel="noopener">{{ short }}</a>
    </p>
  }
  @if (error(); as err) {
    <p class="error">{{ err }}</p>
  }

  <table>
    <thead>
      <tr><th>Short</th><th>Original</th><th>Hits</th></tr>
    </thead>
    <tbody>
      @for (link of links(); track link.code) {
        <tr>
          <td><a [href]="link.shortUrl" target="_blank" rel="noopener">{{ link.code }}</a></td>
          <td class="orig" [title]="link.url">{{ link.url }}</td>
          <td>{{ link.hits }}</td>
        </tr>
      } @empty {
        <tr><td colspan="3" class="empty">No links yet.</td></tr>
      }
    </tbody>
  </table>
</main>
