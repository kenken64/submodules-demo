name: Build bundle

# Rebuilds the `bundle` branch (the whole-app release) from the source submodules.
#
# Triggers below run from `main` only. GitHub runs a `push` workflow using the file
# as it exists ON the pushed branch, so a `push:` trigger here would NOT fire for
# pushes to backend/frontend/cli (the file isn't on those branches). The hourly
# schedule + manual dispatch cover it from main. For instant rebuilds on source
# changes, copy this workflow onto the backend/frontend/cli branches too.
on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 * * * *' # hourly

permissions:
  contents: write

concurrency:
  group: build-bundle
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          submodules: true
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Rebuild and publish bundle
        run: node scripts/build-bundle.mjs --push
